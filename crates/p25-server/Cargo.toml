[package]
name = "p25-server"
version = "0.1.0"
edition = "2024"
description = "P25 trunked radio LiveKit WebRTC server"
license = "MIT OR Apache-2.0"

[[bin]]
name = "p25-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
livekit = "0.7"
livekit-api = "0.4"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trunker = { path = "../trunker" }
