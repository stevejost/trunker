[package]
name = "p25"
version = "0.1.0"
edition = "2024"
description = "P25 trunked radio decoder CLI"
license = "MIT OR Apache-2.0"

[[bin]]
name = "p25"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trunker = { path = "../trunker" }

[dev-dependencies]
num-complex = "0.4"
serde_json = "1"
tempfile = "3"
