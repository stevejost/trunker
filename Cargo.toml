[package]
name = "trunker"
version = "0.1.0"
edition = "2024"
description = "Unix-philosophy P25 trunked radio tools for software-defined radios"
license = "MIT OR Apache-2.0"

[[bin]]
name = "p25"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
