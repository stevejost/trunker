name: Bug report
description: Report a defect or behavioral regression
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area(s)
      description: Select the logical work area(s)
      multiple: true
      options:
        - area:rf-pipeline
        - area:protocol
        - area:tsbk
        - area:cli
        - area:docs
        - area:metadata-output
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
      placeholder: Briefly describe the issue.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Exact steps and commands to reproduce.
      placeholder: |
        1. Run ...
        2. Feed ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command/Args Used
      placeholder: p25 cc --device ... --sample-rate ...

  - type: input
    id: input_data
    attributes:
      label: Input Capture/Fixture
      placeholder: samples/iq/...

  - type: textarea
    id: logs
    attributes:
      label: Logs/Output
      render: shell

